
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: bancocloud-rabbitmq
    hostname: bancocloud-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cuentas-service:
    container_name: bancocloud-cuentas
    build:
      context: ./cuentas-service
      dockerfile: Dockerfile
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SHOW_SQL: "false"
    restart: unless-stopped

  solicitudes-service:
    container_name: bancocloud-solicitudes
    build:
      context: ./solicitudes-service
      dockerfile: Dockerfile
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SHOW_SQL: "false"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  banco-bff:
    container_name: bancocloud-bff
    build:
      context: ./banco-bff
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CUENTAS_SERVICE_URL: http://cuentas-service:8081
      SOLICITUDES_SERVICE_URL: http://solicitudes-service:8082
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_I8wmJa8tS
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_COGNITO_USER_POOL_ID: us-east-1_I8wmJa8tS
      AWS_COGNITO_CLIENTE_GROUP: Cliente
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
    depends_on:
      - cuentas-service
      - solicitudes-service
    restart: unless-stopped

volumes:
  rabbitmq_data:
