spring.application.name=solicitudes-service

server.port=8082

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# RabbitMQ local
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Confirmaciones de publicación RabbitMQ
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Nombres centralizados de mensajeria
app.rabbitmq.exchange=bancocloud.solicitudes.exchange
app.rabbitmq.solicitud-queue=bancocloud.solicitudes.queue
app.rabbitmq.solicitud-routing-key=solicitud.creada
app.rabbitmq.dead-letter-exchange=bancocloud.solicitudes.dlx
app.rabbitmq.dead-letter-queue=bancocloud.solicitudes.dlq
app.rabbitmq.dead-letter-routing-key=solicitud.fallida


# RabbitMQ - Reintentos de solicitudes
app.rabbitmq.retry-exchange=bancocloud.solicitudes.retry.exchange
app.rabbitmq.retry-queue=bancocloud.solicitudes.retry.queue
app.rabbitmq.retry-routing-key=solicitud.reintento

# Tiempo de espera entre intentos: 5 segundos
app.rabbitmq.retry-ttl=5000

# Máximo de intentos totales: 1 inicial + 2 reintentos
app.rabbitmq.max-attempts=3


spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_I8wmJa8tS

# Diagnostico temporal de autenticacion JWT
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=INFO

# RabbitMQ - Demostración
app.rabbitmq.demo-exchange=bancocloud.demo.exchange
app.rabbitmq.demo-queue=bancocloud.demo.queue
app.rabbitmq.demo-routing-key=demo.mensaje

# Pruebas locales de reintentos (desactivar antes de producción)
app.rabbitmq.retry-test.enabled=false

# Tiempo máximo de espera por confirmación del broker (ms)
app.rabbitmq.publisher-confirm-timeout=10000

# RabbitMQ Management API
app.rabbitmq.management.api-url=${RABBITMQ_MANAGEMENT_URL:http://rabbitmq:15672}
app.rabbitmq.management.username=${RABBITMQ_USERNAME}
app.rabbitmq.management.password=${RABBITMQ_PASSWORD}